name: Build Altaris APK

permissions:
  contents: write

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native build deps (Bison, patch, patchelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y bison patch python3 patchelf

      - name: Install Android SDK 36 + NDK 29.0.14206865
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/cmdline-tools"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sdkmanager --list_installed

      - name: Assemble host bootstrap (ivarna + repack altaris separate app)
        run: |
          python3 scripts/assemble_bootstrap.py --package-name com.ivarna.fluxlinux
          ./scripts/verify_bootstrap.sh com.ivarna.fluxlinux
          chmod +x scripts/repack_bootstrap_for_appid.sh
          ./scripts/repack_bootstrap_for_appid.sh com.ivarna.fluxlinux com.altaris.linux
          ./scripts/verify_bootstrap.sh com.altaris.linux

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (altaris flavor, separate app com.altaris.linux)
        run: ./gradlew assembleAltarisDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify APK (targetSdk 28, bootstrap + jniLibs packaged)
        run: |
          APK=$(ls app/build/outputs/apk/altaris/debug/*.apk | head -n 1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -n 1)
          echo "APK: $APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion"
          unzip -l "$APK" | grep -E "bootstrap\.tar|libbash\.so|libproot\.so|assets/clone\.keystore" | head -n 10
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: altaris-debug-apk
          path: app/build/outputs/apk/altaris/debug/*.apk
          if-no-files-found: warn

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/altaris/debug/app-altaris-debug.apk
          TAG="altaris-debug-${GITHUB_SHA::7}"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          gh release create "$TAG" --title "Altaris 1.0.0 — custom home artwork and faster installs" \
            --notes "Altaris 1.0.0 adds custom home artwork with an in-app crop for any photo, restores the Distros tab motion, shows idle instead of a fake 0 fps, and makes Fedora/glibc installs finish reliably by skipping hanging RPM scriptlets. It keeps the 3.20 work: flat monochrome identities, accessibility navigation, the clone viewer Elements panel, universal shell profile, hidden control plane and the `altaris` CLI. APK SHA-256: $SHA" || true
          gh release upload "$TAG" "$APK" --clobber
