name: Build Bliss APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native build deps (Bison, patch, patchelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y bison patch python3 patchelf

      - name: Install Android SDK 36 + NDK 29.0.14206865
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/cmdline-tools"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sdkmanager --list_installed

      - name: Assemble host bootstrap (ivarna + repack bliss separate app)
        run: |
          python3 scripts/assemble_bootstrap.py --package-name com.ivarna.fluxlinux
          ./scripts/verify_bootstrap.sh com.ivarna.fluxlinux
          chmod +x scripts/repack_bootstrap_for_appid.sh
          ./scripts/repack_bootstrap_for_appid.sh com.ivarna.fluxlinux com.nopiece.bliss
          ./scripts/verify_bootstrap.sh com.nopiece.bliss

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ShadowAuto engine APK (vendored, Apache-2.0)
        run: ./gradlew :shadow-shell:assembleDebug --stacktrace

      - name: Bundle the engine into the Bliss APK assets
        run: |
          mkdir -p app/src/main/assets
          cp shadow-shell/build/outputs/apk/debug/shadow-shell-debug.apk app/src/main/assets/shadow-shell.apk
          ls -la app/src/main/assets/shadow-shell.apk

      - name: Build debug APK (bliss flavor, separate app com.nopiece.bliss)
        run: ./gradlew assembleBlissDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify APK (targetSdk 28, bootstrap + jniLibs packaged)
        run: |
          APK=$(ls app/build/outputs/apk/bliss/debug/*.apk | head -n 1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -n 1)
          echo "APK: $APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion"
          unzip -l "$APK" | grep -E "bootstrap\.tar|libbash\.so|libproot\.so" | head -n 8
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bliss-debug-apk
          path: app/build/outputs/apk/bliss/debug/*.apk
          if-no-files-found: warn
