name: Build Altaris APK

permissions:
  contents: write

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One build per ref: a newer push cancels the older run instead of racing it to
# the same release tag.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native build deps (Bison, patch, patchelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y bison patch python3 patchelf

      - name: Install Android SDK 36 + NDK 29.0.14206865
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sdkmanager --list_installed

      - name: Assemble host bootstrap (ivarna + repack altaris separate app)
        run: |
          python3 scripts/assemble_bootstrap.py --package-name com.ivarna.fluxlinux
          ./scripts/verify_bootstrap.sh com.ivarna.fluxlinux
          chmod +x scripts/repack_bootstrap_for_appid.sh
          ./scripts/repack_bootstrap_for_appid.sh com.ivarna.fluxlinux com.altaris.linux
          ./scripts/verify_bootstrap.sh com.altaris.linux

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (altaris flavor, separate app com.altaris.linux)
        run: ./gradlew assembleAltarisDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Unit tests (diagnostics)
        continue-on-error: true
        run: ./gradlew testAltarisDebugUnitTest --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify APK (targetSdk 28, bootstrap + jniLibs packaged)
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/altaris/debug/*.apk | head -n 1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -n 1)
          echo "APK: $APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion"
          # The REA installers are shipped as assets; a missing one used to fail
          # silently on device, so fail the build instead.
          unzip -l "$APK" | grep -E "assets/scripts/rea/(rea-core-install|install-tool|ghidra-install|ghidra-decompiler-build|ghidra-analyze)\.sh"
          # The URL shim is the only way a guest can open a link; a missing one
          # makes every CLI sign-in link unopenable, so pin it here too.
          unzip -l "$APK" | grep -E "assets/scripts/altaris-(open|cli)\.sh"
          unzip -l "$APK" | grep -E "bootstrap\.tar|libbash\.so|libproot\.so|assets/clone\.keystore" | head -n 10
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: altaris-debug-apk
          path: |
            app/build/outputs/apk/altaris/debug/*.apk
            apk-sha256.txt
          if-no-files-found: warn

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/altaris/debug/app-altaris-debug.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -n 1)
          VERSION=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          [ -n "$VERSION" ] || VERSION=0.0.0
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          TAG="v${VERSION}-${GITHUB_SHA::7}"

          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          {
            echo "## Altaris ${VERSION}"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` · built $(date -u '+%Y-%m-%d %H:%M UTC') by GitHub Actions."
            echo
            echo "### Changes"
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..HEAD" | head -n 60
            else
              git log --no-merges --max-count=20 --pretty='- %s' HEAD
            fi
            echo
            echo "### Install"
            echo "Download \`app-altaris-debug.apk\` below (arm64-v8a, package \`com.altaris.linux\`)."
            echo
            echo '```'
            echo "sha256  ${SHA}"
            echo '```'
          } > release-notes.md

          gh release create "$TAG" \
            --title "Altaris ${VERSION} — ${GITHUB_SHA::7}" \
            --notes-file release-notes.md \
            --latest \
            "$APK" || true
          gh release upload "$TAG" "$APK" --clobber
          gh release view "$TAG" --json url,tagName,assets
