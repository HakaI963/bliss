name: Build Altaris APK

permissions:
  contents: write

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native build deps (Bison, patch, patchelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y bison patch python3 patchelf

      - name: Install Android SDK 36 + NDK 29.0.14206865
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/cmdline-tools"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sdkmanager --list_installed

      - name: Assemble host bootstrap (ivarna + repack altaris separate app)
        run: |
          python3 scripts/assemble_bootstrap.py --package-name com.ivarna.fluxlinux
          ./scripts/verify_bootstrap.sh com.ivarna.fluxlinux
          chmod +x scripts/repack_bootstrap_for_appid.sh
          ./scripts/repack_bootstrap_for_appid.sh com.ivarna.fluxlinux com.altaris.linux
          ./scripts/verify_bootstrap.sh com.altaris.linux

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (altaris flavor, separate app com.altaris.linux)
        run: ./gradlew assembleAltarisDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Unit tests (diagnostics)
        continue-on-error: true
        run: ./gradlew testAltarisDebugUnitTest --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify APK (targetSdk 28, bootstrap + jniLibs packaged)
        run: |
          APK=$(ls app/build/outputs/apk/altaris/debug/*.apk | head -n 1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -n 1)
          echo "APK: $APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion"
          unzip -l "$APK" | grep -E "bootstrap\.tar|libbash\.so|libproot\.so|assets/clone\.keystore" | head -n 10
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: altaris-debug-apk
          path: app/build/outputs/apk/altaris/debug/*.apk
          if-no-files-found: warn

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/altaris/debug/app-altaris-debug.apk
          TAG="altaris-debug-${GITHUB_SHA::7}"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          gh release create "$TAG" --title "Altaris 1.1.2 — Ghidra headless analysis on device (fixed JDK)" \
            --notes "Altaris 1.1.0 adds REA (github.com/morluto/rea) as a first-class tool. Tools > Reverse engineering installs Node 22 and rea-agents inside any installed proot or chroot distro, then publishes every REA MCP tool through the Altaris MCP endpoint at http://127.0.0.1:47831/mcp, so any agent in the distro gets APK, native binary, firmware, JavaScript, .NET, WASM and live-device analysis next to the clone tools. Per-tool installs cover JADX, Apktool, AAPT, ADB, Java, binutils, GDB, Rizin, Python, binwalk, 7-Zip, TShark and SQLite; Ghidra now installs and runs headless on ARM64 via altaris_ghidra_analyze. It is pinned to 11.4.3 (12.2 needs Java 25, which no phone distro packages) and the installer provisions a full JDK 21 — Ghidra's launcher rejects a JRE because it requires javac — falling back to a Temurin 21 arm64 tarball when the distro has none. The analysis wrapper sets JAVA_HOME itself so a stale guest JAVA_HOME cannot break it. IDA/Hopper/JEB are license-gated. 'Register in agents' writes the endpoint into Claude Code, OpenCode, Codex, Gemini, Cursor and Kimi configs inside the distro. altaris_rea_clone_apk exports a clone's APKs to /sdcard/Download/Altaris/rea for analysis. APK SHA-256: $SHA" || true
          gh release upload "$TAG" "$APK" --clobber
