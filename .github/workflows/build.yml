name: Build Altaris APK

permissions:
  contents: write

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native build deps (Bison, patch, patchelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y bison patch python3 patchelf

      - name: Install Android SDK 36 + NDK 29.0.14206865
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/cmdline-tools"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sdkmanager --list_installed

      - name: Assemble host bootstrap (ivarna + repack altaris separate app)
        run: |
          python3 scripts/assemble_bootstrap.py --package-name com.ivarna.fluxlinux
          ./scripts/verify_bootstrap.sh com.ivarna.fluxlinux
          chmod +x scripts/repack_bootstrap_for_appid.sh
          ./scripts/repack_bootstrap_for_appid.sh com.ivarna.fluxlinux com.nopiece.bliss
          ./scripts/verify_bootstrap.sh com.nopiece.bliss

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (altaris flavor, separate app com.nopiece.bliss)
        run: ./gradlew assembleAltarisDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify APK (targetSdk 28, bootstrap + jniLibs packaged)
        run: |
          APK=$(ls app/build/outputs/apk/altaris/debug/*.apk | head -n 1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -n 1)
          echo "APK: $APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion"
          unzip -l "$APK" | grep -E "bootstrap\.tar|libbash\.so|libproot\.so|assets/clone\.keystore" | head -n 10
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: altaris-debug-apk
          path: app/build/outputs/apk/altaris/debug/*.apk
          if-no-files-found: warn

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/altaris/debug/app-altaris-debug.apk
          TAG="altaris-debug-${GITHUB_SHA::7}"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          gh release create "$TAG" --title "Altaris 3.20.0 — accessibility navigation and the Iridescent identity" \
            --notes "Altaris 3.20 replaces screenshot+OCR navigation with a real accessibility node tree: an AccessibilityService in its own process reads the UI of the clone display, so elements can be tapped, typed into and scrolled by name (new /uiauto endpoints and altaris_ui_* MCP tools, plus an Elements panel in the clone viewer). The identity system is new as well: five bright schemes with dark and light variants, an animated AGSL aurora backdrop and spring press feedback, with Iridescent as the default. It also keeps the 3.19 work: universal shell profile, bundled nghttp3/ngtcp2 runtime repair, hidden control plane, desktop-only agent scanning, `altaris` CLI with a `altaris` alias. APK SHA-256: $SHA" || true
          gh release upload "$TAG" "$APK" --clobber
