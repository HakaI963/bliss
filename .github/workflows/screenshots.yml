name: UI screenshots (Paparazzi)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  paparazzi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native build deps (Bison, patch, patchelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y bison patch python3 patchelf

      - name: Install Android SDK 36 + NDK 29.0.14206865
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sdkmanager --list_installed

      - name: Assemble host bootstrap (altaris flavor assets)
        run: |
          python3 scripts/assemble_bootstrap.py --package-name com.ivarna.fluxlinux
          chmod +x scripts/repack_bootstrap_for_appid.sh
          ./scripts/repack_bootstrap_for_appid.sh com.ivarna.fluxlinux com.altaris.linux

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Record Paparazzi screenshots
        run: ./gradlew :app:recordPaparazziAltarisDebug --tests 'com.altaris.linux.design.*' --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paparazzi-screenshots
          path: app/src/test/snapshots/images/**
          if-no-files-found: warn

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-report
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
