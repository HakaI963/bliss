<?xml version="1.0" encoding="UTF-8"?>
<!-- Folio monochrome desktop wallpaper (source of fluxlinux-dark.png).
     Pure geometry, grays only — no colors, no external assets. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2772" viewBox="0 0 1280 2772">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="0.45" stop-color="#111216"/>
      <stop offset="1" stop-color="#07070A"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="2772" fill="url(#bg)"/>
  <rect width="1280" height="2772" fill="url(#vig)"/>
  <rect x="96" y="125" width="1088" height="2522" fill="none" stroke="#22242A" stroke-width="2"/>
  <circle cx="640" cy="1109" r="191" fill="none" stroke="#1B1D22" stroke-width="4"/>
  <circle cx="640" cy="1109" r="82" fill="none" stroke="#22242A" stroke-width="4"/>
</svg>
